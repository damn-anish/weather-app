<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather-App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h2>Weather App</h2>

        <div class="search-row">
            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <button
            class="loc-btn"
            onclick="useMyLocation()"
        >
            Use My Location
        </button>

        <div
            class="result"
            id="result"
        ></div>

        <div
            class="nearby"
            id="nearby"
        ></div>

    </div>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
